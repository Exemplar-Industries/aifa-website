<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #000000;
            background-image: radial-gradient(circle at center, #1a0000 0%, #000000 100%);
            position: relative;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
.grain {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 1;
        }
.letterbox-top, .letterbox-bottom {
            position: absolute;
            left: 0; right: 0; height: 40px;
            background: #000; z-index: 2;
        }
        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }
.header {
            position: relative;
            z-index: 3;
            padding-top: 80px;
            padding-left: 80px;
            padding-right: 80px;
        }
.lesson-tag {
            color: #E31E24;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
h2 {
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 30px;
            border-left: 8px solid #E31E24;
            padding-left: 24px;
        }
.content-area {
            position: relative;
            z-index: 3;
            display: flex;
            padding-left: 80px;
            padding-right: 80px;
            gap: 50px;
            align-items: stretch;
            flex-grow: 1;
            margin-bottom: 50px;
        }
.left-col {
            flex: 0.35;
            display: flex;
            flex-direction: column;
        }
.creed-title-block {
            background-color: #E31E24;
            color: #0a0a0a;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #E31E24;
            flex-grow: 1;
        }
.creed-title-block i {
            font-size: 80px;
            margin-bottom: 20px;
        }
.creed-title-block span {
            font-size: 36px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
            letter-spacing: 2px;
        }
.right-col {
            flex: 0.65;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
.creed-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
.creed-list li {
            font-size: 22px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 20px 24px;
            border-left: 6px solid #E31E24;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
.creed-list li i {
            color: #E31E24;
            font-size: 24px;
            margin-right: 20px;
            min-width: 30px;
            text-align: center;
        }
    </style>
</head>
<body><div class="slide-container">
        <div class="grain"></div>
        <div class="letterbox-top"></div>
<div class="header">
            <div class="lesson-tag">Identity</div>
            <h2>The AI Filmmaker's Creed</h2>
        </div>
<div class="content-area">
            <div class="left-col">
                <div class="creed-title-block">
                    <i class="fas fa-bolt"></i>
                    <span>The<br>Creed</span>
                </div>
            </div>
<div class="right-col">
                <ul class="creed-list">
                    <li>
                        <i class="fas fa-check"></i>
                        I am a creator, not a consumer.
                    </li>
                    <li><i class="fas fa-check"></i> I value finished demonstratable work over perfect work.</li>
                    <li>
                        <i class="fas fa-check"></i>
                        I master workflows, not just tools.
                    </li>
                    <li><i class="fas fa-check"></i> I Use Traditional Cinema&nbsp;To Tell Great Stories.</li>
                    <li><i class="fas fa-check"></i> I build in public and Inspire Others.</li>
                </ul>
            </div>
        </div>
<div class="letterbox-bottom"></div>
    </div>
</body>
</html>
