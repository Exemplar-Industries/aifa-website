<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #000000;
            background-image: radial-gradient(circle at center, #1a0000 0%, #000000 100%);
            position: relative;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }
        
        /* Film grain effect */
        .grain {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 1;
        }

        /* Cinematic letterbox bars */
        .letterbox-top, .letterbox-bottom {
            position: absolute;
            left: 0;
            right: 0;
            height: 40px;
            background: #000;
            z-index: 2;
        }
        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }

        .content-wrapper {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 0 100px;
        }

        .lesson-number {
            color: #E31E24;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .lesson-number::before, .lesson-number::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 2px;
            background-color: #E31E24;
        }
        .lesson-number::before { left: -60px; }
        .lesson-number::after { right: -60px; }

        .main-title {
            font-size: 64px;
            font-weight: 900;
            line-height: 1.15;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 32px;
            font-weight: 400;
            color: #cccccc;
            letter-spacing: 1px;
            margin-bottom: 60px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grain"></div>
        <div class="letterbox-top"></div>
        
        <div class="content-wrapper">
            <div class="lesson-number">LESSON 3</div>
            <h1 class="main-title">The AI Filmmaker's<br>Manifesto</h1>
            <div class="subtitle">AI Film Academy | Week 1</div>
        </div>

        <div class="letterbox-bottom"></div>
    </div>
</body>
</html>
