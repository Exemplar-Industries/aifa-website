<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #000000;
            background-image: radial-gradient(circle at center, #1a0000 0%, #000000 100%);
            position: relative;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .grain {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 1;
        }

        .letterbox-top, .letterbox-bottom {
            position: absolute;
            left: 0; right: 0; height: 40px;
            background: #000; z-index: 2;
        }
        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }

        .header {
            position: relative;
            z-index: 3;
            padding-top: 80px;
            padding-left: 80px;
            padding-right: 80px;
        }

        .lesson-tag {
            color: #E31E24;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 42px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 20px;
            border-left: 8px solid #E31E24;
            padding-left: 24px;
        }

        .content-area {
            position: relative;
            z-index: 3;
            padding-left: 80px;
            padding-right: 80px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex-grow: 1;
            justify-content: center;
            padding-bottom: 80px;
        }

        .massive-statement {
            font-size: 56px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
        }

        .massive-statement .red {
            color: #E31E24;
        }

        .sub-statement {
            font-size: 26px;
            line-height: 1.6;
            color: #cccccc;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            font-weight: 400;
        }

        .icon-row {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 40px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgba(227, 30, 36, 0.1);
            border: 2px solid #E31E24;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #E31E24;
        }

        .icon-label {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grain"></div>
        <div class="letterbox-top"></div>
        
        <div class="header">
            <div class="lesson-tag">The AFA Method</div>
        </div>

        <div class="content-area">
            <div class="massive-statement">
                Master a <span class="red">Simple Workflow</span>
            </div>
            
            <p class="sub-statement">
                We don't teach you 50 different tools. We teach you one repeatable, professional system that works every single time. Learn the workflow once, and you can create anything.
            </p>

            <div class="icon-row">
                <div class="icon-item">
                    <div class="icon-circle"><i class="fas fa-clipboard-list"></i></div>
                    <div class="icon-label">Pre-Production</div>
                </div>
                <div class="icon-item">
                    <div class="icon-circle"><i class="fas fa-video"></i></div>
                    <div class="icon-label">Production</div>
                </div>
                <div class="icon-item">
                    <div class="icon-circle"><i class="fas fa-cut"></i></div>
                    <div class="icon-label">Post-Production</div>
                </div>
            </div>
        </div>

        <div class="letterbox-bottom"></div>
    </div>
</body>
</html>
